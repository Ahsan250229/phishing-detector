name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  basic-checks:
    name: Basic Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "Repo root:"
          ls -la
          echo "Docs:"
          ls -la docs || true

      - name: Placeholder - add your build/test steps later
        run: |
          echo "CI skeleton is running."
          echo "Next: add lint + unit tests + security scans based on your tech stack."
