name: Pipeline (Build → Security Scan → Test → Deploy)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests (pytest)
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ hashFiles('Dockerfile') != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image tags
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository }}:latest" >> $GITHUB_ENV
          echo "IMAGE_SHA=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "$IMAGE" -t "$IMAGE_SHA" .
          docker push "$IMAGE"
          docker push "$IMAGE_SHA"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('Dockerfile') != '' }}
    steps:
      - name: Deploy placeholder
        run: |
          echo "Deploy step placeholder (add your deploy commands here)."
