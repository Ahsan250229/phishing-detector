name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Lint and Tests (auto-detect stack)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show structure
        run: |
          echo "Root:"
          ls -la
          echo "docs:"
          ls -la docs || true
          echo "src:"
          ls -la src || true
          echo "tests:"
          ls -la tests || true

      # -------------------------
      # Python (if requirements.txt exists)
      # -------------------------
      - name: Set up Python
        if: ${{ hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies (requirements.txt)
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Python dependencies (pyproject.toml)
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Python tests (pytest)
        if: ${{ hashFiles('tests/**') != '' && (hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != '') }}
        env:
          PYTHONPATH: .
        run: |
          pytest -q

      # -------------------------
      # Node.js (if package.json exists)
      # -------------------------
      - name: Set up Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm ci

      - name: Run Node tests
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm test --if-present

      # -------------------------
      # PHP (if composer.json exists)
      # -------------------------
      - name: Set up PHP
        if: ${{ hashFiles('composer.json') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install PHP dependencies
        if: ${{ hashFiles('composer.json') != '' }}
        run: |
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHP tests (phpunit)
        if: ${{ hashFiles('composer.json') != '' && hashFiles('vendor/bin/phpunit') != '' }}
        run: |
          ./vendor/bin/phpunit

      # -------------------------
      # If no stack detected, do not fail the build
      # -------------------------
      - name: No stack detected (placeholder)
        if: ${{ hashFiles('requirements.txt') == '' && hashFiles('pyproject.toml') == '' && hashFiles('package.json') == '' && hashFiles('composer.json') == '' }}
        run: |
          echo "No runtime stack files detected yet (requirements.txt / pyproject.toml / package.json / composer.json)."
          echo "CI is configured and will run tests once implementation files are added."
