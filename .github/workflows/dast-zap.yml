name: DAST (OWASP ZAP Baseline)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start FastAPI for DAST
        env:
          PYTHONPATH: .
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # Auto-detect app module path
          if [ -f src/main.py ]; then
            APP="src.main:app"
          elif [ -f main.py ]; then
            APP="main:app"
          else
            echo "❌ Cannot find src/main.py or main.py"
            exit 1
          fi

          echo "Starting FastAPI with $APP"
          uvicorn "$APP" --host 127.0.0.1 --port 8000 --log-level info &
          echo $! > uvicorn.pid

          # Wait up to ~30s for the server to be reachable
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "FastAPI is up on /health."
              exit 0
            fi
            if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "FastAPI is up on /."
              exit 0
            fi
            sleep 2
          done

          echo "❌ FastAPI did not become reachable in time."
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8000"
        continue-on-error: true

      - name: Stop FastAPI
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" || true
          fi
