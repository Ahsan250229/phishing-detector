name: DAST (OWASP ZAP Baseline)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          test -f requirements.txt || (echo "requirements.txt not found at repo root" && exit 1)
          pip install -r requirements.txt

      - name: Start FastAPI for DAST
        env:
          PYTHONPATH: .
        run: |
          set -e
          # Auto-detect app entry point
          if [ -f src/main.py ]; then
            APP="src.main:app"
          elif [ -f main.py ]; then
            APP="main:app"
          else
            echo "Cannot find src/main.py or main.py to start FastAPI."
            exit 1
          fi

          echo "Starting FastAPI with: $APP"
          uvicorn "$APP" --host 127.0.0.1 --port 8000 --log-level info &
          echo $! > uvicorn.pid

          # Wait until server is reachable (max ~30s)
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "FastAPI is up."
              exit 0
            fi
            sleep 2
          done

          echo "FastAPI did not become reachable in time."
          echo "Uvicorn logs (if any) may appear above."
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8000"
        continue-on-error: true

      - name: Stop FastAPI
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" || true
          fi
