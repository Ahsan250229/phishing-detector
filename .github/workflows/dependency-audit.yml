name: Dependency Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"   # Weekly Monday 03:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python: pip-audit
      - name: Set up Python
        if: ${{ hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python dependency audit (pip-audit)
        if: ${{ hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || true
          else
            pip-audit || true
          fi

      # Node: npm audit
      - name: Set up Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node dependency audit (npm audit)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm ci
          npm audit --audit-level=high || true

      # PHP: composer audit
      - name: Set up PHP
        if: ${{ hashFiles('composer.json') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: PHP dependency audit (composer audit)
        if: ${{ hashFiles('composer.json') != '' }}
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer audit || true

      - name: No dependency files detected (placeholder)
        if: ${{ hashFiles('requirements.txt') == '' && hashFiles('pyproject.toml') == '' && hashFiles('package.json') == '' && hashFiles('composer.json') == '' }}
        run: |
          echo "No dependency manifest detected yet. Add requirements.txt / pyproject.toml / package.json / composer.json to enable audits."
