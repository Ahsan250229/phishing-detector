name: SAST (Semgrep)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (auto rules)
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep
          semgrep --config=auto --error || true
